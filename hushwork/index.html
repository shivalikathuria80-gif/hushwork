<style>
/* Colour tokens. Space-separated RGB so Tailwind can add opacity (bg-accent/20).
   Text-on-surface pairs are >= 4.5:1, field borders and icons >= 3:1, in both themes. */
:root{color-scheme:light;--bg:247 246 252;--surface:255 255 255;--raised:239 236 250;--ink:24 20 40;--mute:98 92 120;--line:226 222 240;--field:139 132 163;--hint:111 105 137;--accent:124 58 237;--accent-text:109 40 217}
.dark{color-scheme:dark;--bg:11 10 18;--surface:21 18 31;--raised:32 26 56;--ink:244 242 251;--mute:185 180 204;--line:36 30 56;--field:107 100 133;--hint:168 163 188;--accent:124 58 237;--accent-text:196 181 253}
html{scroll-behavior:smooth;scroll-padding-top:88px;scrollbar-color:rgb(var(--field)) transparent}
body{background:rgb(var(--bg));color:rgb(var(--ink));font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
h1,h2,h3{text-wrap:balance}p{text-wrap:pretty}
a{color:rgb(var(--accent-text));text-underline-offset:3px}a:hover{opacity:.8}
::selection{background:rgb(var(--accent)/.35)}
input,textarea{caret-color:rgb(var(--accent-text))}
:focus-visible{outline:2px solid rgb(var(--accent-text));outline-offset:2px}
.on-accent :focus-visible{outline-color:#fff}
/* Motion: only what explains something. Hero entrance (once), plan steps, tab panel, loaders. */
@keyframes hwRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.caret{animation:blink 1s steps(1) infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
