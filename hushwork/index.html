<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hushwork — describe the task, we run it quietly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('hw-theme');if(t!=='light')document.documentElement.classList.add('dark')}catch(e){}</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['Geist Mono','ui-monospace','monospace']},colors:{bg:'rgb(var(--bg) / <alpha-value>)',surface:'rgb(var(--surface) / <alpha-value>)',raised:'rgb(var(--raised) / <alpha-value>)',ink:'rgb(var(--ink) / <alpha-value>)',mute:'rgb(var(--mute) / <alpha-value>)',line:'rgb(var(--line) / <alpha-value>)',accent:'rgb(var(--accent) / <alpha-value>)'},borderRadius:{xl:'14px','2xl':'20px','3xl':'28px'}}}}</script>
<style>
:root{--bg:247 246 252;--surface:255 255 255;--raised:239 236 250;--ink:24 20 40;--mute:98 92 120;--line:226 222 240;--accent:124 58 237}
.dark{--bg:11 10 18;--surface:21 18 31;--raised:32 26 56;--ink:244 242 251;--mute:185 180 204;--line:36 30 56;--accent:124 58 237}
html{scroll-behavior:smooth}body{background:rgb(var(--bg));color:rgb(var(--ink));font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:rgb(var(--accent))}a:hover{opacity:.8}
:focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px}
@keyframes hwRise{from{opacity:0;transform:translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}@keyframes hwFloat{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-46%,24px) scale(1.12)}}@keyframes hwShine{to{background-position:200% center}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(30px,-20px,0)}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes pulseDot{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes blink{50%{opacity:0}}
.fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
.flow{stroke-dasharray:4 8;animation:dash 1.2s linear infinite}
.caret{animation:blink 1s steps(1) infinite}
.orbit{animation:spin var(--d,40s) linear infinite}.orbit>*{animation:spin var(--d,40s) linear infinite reverse}
.noscroll::-webkit-scrollbar{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Features.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>

</body></html>
