# The clock for scheduled runs. GitHub runs this about every 5 minutes (it can be a few minutes late) and asks Hushwork "is anything due?".
# It needs ONE secret in the repository (Settings, Secrets and variables, Actions, New repository secret):
#   CRON_SECRET   the same value as CRON_SECRET on Vercel
# Each way it can go wrong is its own step with its own name, so the run page says what is wrong without reading any log:
#   "Secret missing on GitHub"            -> add CRON_SECRET to the repository's Actions secrets
#   "Password refused by Hushwork (401)"  -> the value differs from Vercel's, or Vercel was not redeployed after changing it
#   "Hushwork has no password (503)"      -> CRON_SECRET is missing on Vercel (or not ticked for Production)
#   "Hushwork failed (other answer)"      -> the app answered but something inside failed (for example schedules.sql or the service key)
# A green run means Hushwork really answered 200. See docs/deploy.md section 7.
name: clock
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Secret missing on GitHub
        if: ${{ env.CRON_SECRET == '' }}
        run: |
          echo "CRON_SECRET is not set in this repository's Actions secrets."
          exit 1
      - name: Ask Hushwork if a schedule is due
        id: call
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" https://hushwork-six.vercel.app/api/cron/tick || true)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Hushwork answered $status"
          head -c 300 response.txt || true
      - name: Password refused by Hushwork (401)
        if: ${{ steps.call.outputs.status == '401' }}
        run: exit 1
      - name: Hushwork has no password (503)
        if: ${{ steps.call.outputs.status == '503' }}
        run: exit 1
      - name: Hushwork failed (other answer)
        if: ${{ steps.call.outputs.status != '' && steps.call.outputs.status != '200' && steps.call.outputs.status != '401' && steps.call.outputs.status != '503' }}
        run: exit 1
