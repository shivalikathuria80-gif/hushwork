# The clock for scheduled runs. GitHub runs this about every 5 minutes (it can be a few minutes late) and asks Hushwork "is anything due?".
# It needs ONE secret in the repository (Settings, Secrets and variables, Actions, New repository secret):
#   CRON_SECRET   the same value as CRON_SECRET on Vercel
# Until that secret exists the job fails with a message saying so (a green run means Hushwork really answered 200). See docs/deploy.md section 7.
name: clock
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask Hushwork if a schedule is due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set in this repository's Actions secrets, so the clock cannot work."; exit 1; fi
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" https://hushwork-six.vercel.app/api/cron/tick)
          echo "Hushwork answered $status"
          head -c 300 response.txt
          [ "$status" = "200" ]
